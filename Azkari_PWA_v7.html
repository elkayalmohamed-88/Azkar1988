${L.map(zrow).join('')||'<div class="card mu">لا توجد أذكار هنا. اضغط + لإضافة ذكر.</div>'}`

const parts=z=>{
if(z.b)return[z.t,z.b];
if(z.t.length>34){
const w=z.t.split(/\s+/);
return[w.slice(0,5).join(' ')+'…',z.t]
}
return[z.t,'']
};

const zhead=(z,full)=>{
const[a,b]=parts(z),
n=a.length,
s=n<30?24:n<60?21:18;
return `<div class="zh" style="font-size:${s}px">${a}</div>${b?`<div class="zb ${full?'':'cl'}">${b}</div>`:''}`
};

function zrow(z){
const c=cnt(z.id,D(0));
return `<div class="card zc" onclick="pick(${z.id})">${zhead(z,0)}
<div class="row" style="margin-top:12px"><div style="flex:1;min-width:0"><div class="row sp mu" style="margin-bottom:8px"><span>${S.cats[z.c]||''}</span><span class="row" style="gap:0" onclick="event.stopPropagation()"><button class="mini" onclick="event.stopPropagation();toggleFav(${z.id})">${z.fav?'★':'☆'}</button><button class="mini" onclick="openForm(${z.id})">✎</button><button class="mini" onclick="detail(${z.id})">▥</button><button class="mini" onclick="del(${z.id})">🗑</button></span><span>🔥 ${streak(z)}</span></div><div class="bar"><i style="width:${pc(c,z.g)}%"></i></div></div>
<button class="tb" style="background:conic-gradient(var(--ac) ${pc(c,z.g)}%,var(--bd) 0)" onclick="event.stopPropagation();hit(${z.id})"><i><b>${c}</b><small>/ ${z.g}</small></i></button></div></div>`
}

function openDay(k){
DAY=k;
V='tas';
R();
scrollTo(0,0)
}

function hit(id){
S.cur=id;
DAY=D(0);
add(id,1,1,D(0));
R()
}

S.rd=Object.assign({fs:32,th:'dark',tk:true,fd:true,au:true},S.rd||{});
let RD=null,WL=null,TX=0;
const THM={dark:['#0a1f1a','#e8f5ef','#00d68f','#8a9fa3'],sepia:['#f6efe0','#3b2f1a','#0a7a52','#8a7a5c'],black:['#000','#d8d8d8','#00d68f','#777']};
const stripT=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'');
function readMode(i){const L=S.z.filter(z=>z.c==Q);if(!L.length)return;RD={ids:L.map(z=>z.id),i:i||0,set:0};
let e=$('#rd');if(!e){e=document.createElement('div');e.id='rd';document.body.appendChild(e);
e.addEventListener('touchstart',v=>{TX=v.changedTouches[0].clientX},{passive:true});
e.addEventListener('touchend',v=>{const d=v.changedTouches[0].clientX-TX;if(Math.abs(d)>70)rdGo(d<0?1:-1)},{passive:true})}
e.style.cssText='position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>WL=w).catch(()=>{})}catch(x){}rdR()}
function rdClose(){try{WL&&WL.release()}catch(x){}WL=null;RD=null;const e=$('#rd');if(e)e.remove();R()}
function rdGo(d){if(!RD)return;RD.i=Math.max(0,Math.min(RD.ids.length-1,RD.i+d));rdR();const t=$('#rdt');if(t)t.scrollTop=0}
function rdHit(){if(!RD)return;const z=Z(RD.ids[RD.i]);add(z.id,1,1,D(0));save();rdR();
if(S.rd.au&&cnt(z.id,D(0))==z.g&&RD.i<RD.ids.length-1)setTimeout(()=>{if(RD&&RD.ids[RD.i]==z.id)rdGo(1)},600)}
function rdSet(k,v){S.rd[k]=v;save();rdR()}
function rdR(){const e=$('#rd');if(!e||!RD)return;const r=S.rd,[bg,tx,ac,mu]=THM[r.th],z=Z(RD.ids[RD.i]),c=cnt(z.id,D(0)),n=RD.ids.length,dn=c>=z.g;
const B=`width:44px;height:44px;border-radius:50%;background:${mu}22;color:${tx};font-size:20px;font-weight:800`,
P=(a,t,k,v)=>`<button onclick="rdSet('${k}',${v})" style="flex:1;padding:9px 4px;border-radius:12px;font-size:14px;background:${a?ac:mu+'22'};color:${a?bg:tx}">${t}</button>`;
e.style.background=bg;e.style.color=tx;
e.innerHTML=`<div style="display:flex;align-items:center;gap:8px;padding:12px 14px"><button onclick="rdClose()" style="${B}">✕</button><div style="flex:1;text-align:center;color:${mu};font-size:15px">${S.cats[Q]||''} • ${RD.i+1} / ${n}</div><button onclick="RD.set=!RD.set;rdR()" style="${B};font-size:16px">Aa</button></div>
<div style="height:4px;background:${mu}33;margin:0 14px;border-radius:4px"><div style="height:100%;width:${(RD.i+1)/n*100}%;background:${ac};border-radius:4px"></div></div>
${RD.set?`<div style="margin:12px 14px 0;padding:12px;border-radius:18px;background:${mu}22;display:flex;flex-direction:column;gap:8px;font-size:14px"><div style="display:flex;gap:6px">${P(0,'A−','fs',Math.max(20,r.fs-4))}${P(0,'A+','fs',Math.min(64,r.fs+4))}${P(r.th=='dark','داكن','th',"'dark'")}${P(r.th=='sepia','ورقي','th',"'sepia'")}${P(r.th=='black','أسود','th',"'black'")}</div><div style="display:flex;gap:6px">${P(r.tk,'التشكيل','tk',!r.tk)}${P(r.fd,'الفضل','fd',!r.fd)}${P(r.au,'انتقال تلقائي','au',!r.au)}</div></div>`:''}
<div id="rdt" onclick="rdHit()" style="flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:24px 22px;text-align:center;-webkit-tap-highlight-color:transparent"><div style="margin:auto 0"><div style="font-family:Amiri,'Traditional Arabic',serif;font-size:${r.fs}px;line-height:2.1;font-weight:700">${r.tk?z.t:stripT(z.t)}</div>${r.fd&&z.b?`<div style="margin-top:18px;color:${mu};font-size:${Math.round(r.fs*.5)}px;line-height:1.9">${z.b}</div>`:''}</div></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 22px 18px"><button onclick="rdGo(-1)" style="${B};opacity:${RD.i?1:.3}">→</button><button onclick="rdHit()" style="width:88px;height:88px;border-radius:50%;background:conic-gradient(${ac} ${pc(c,z.g)}%,${mu}44 0);display:grid;place-items:center"><i style="width:72px;height:72px;border-radius:50%;background:${bg};display:grid;place-items:center;font-style:normal;color:${dn?ac:tx}"><b style="font-size:${dn?30:24}px">${dn?'✓':c}</b><small style="color:${mu};margin-top:-14px">/ ${z.g}</small></i></button><button onclick="rdGo(1)" style="${B};opacity:${RD.i<n-1?1:.3}">←</button></div>`}
function Cat(){
const k=Q,
L=S.z.filter(z=>z.c==k),
G=L.reduce((a,z)=>a+z.g,0),
T=L.reduce((a,z)=>a+Math.min(cnt(z.id,D(0)),z.g),0),
dn=L.filter(z=>cnt(z.id,D(0))>=z.g).length,
p=pc(T,G);

return `<div class="row sp"><button class="ib" onclick="nav('home')">→</button><h1 style="font-size:26px;flex:1">${S.cats[k]||''}</h1><button class="ib" onclick="readMode(0)">📖</button><button class="ib" onclick="pageForm('${k}')">✎</button><button class="ib" onclick="delPage('${k}')">🗑</button></div>

<div class="card row sp" style="margin-top:14px"><div><div style="font-size:22px;font-weight:800">${dn} / ${L.length} أذكار مكتملة</div><div class="mu">اضغط الزر الدائري بجانب كل ذكر للتسبيح</div></div><div style="position:relative;width:84px;height:84px;display:grid;place-items:center">${ring(p,84,9)}<b class="ac" style="position:absolute">${p}%</b></div></div>

${L.map(zrow).join('')||'<div class="card mu">الصفحة فارغة. أضف أول ذكر.</div>'}

<button class="btn" onclick="openForm(0,'${k}')">+ إضافة ذكر لهذه الصفحة</button>`
}

function pageForm(k){
sheet(`<h2 style="margin:0 0 8px">${k?'تعديل اسم الصفحة':'صفحة جديدة'}</h2>اسم الصفحة<input id="pn" value="${k?S.cats[k]:''}" placeholder="مثال: أذكار الاستيقاظ"><button class="btn" onclick="savePage('${k||''}')">حفظ</button>`)
}

const n=$('#pn').value.trim();
if(!n)return;
if(k)S.cats[k]=n;
else{k='c'+(++S.nid);S.cats[k]=n;Q=k;V='cat'}

R();

}

function delPage(k){
const n=S.z.filter(z=>z.c==k).length;
sheet(`<h3>حذف صفحة "${S.cats[k]}"؟</h3><div class="mu" style="margin-bottom:14px">سيُحذف معها ${n} من الأذكار.</div><button class="btn rd" onclick="delete S.cats[${JSON.stringify(k)}];S.z=S.z.filter(z=>z.c!=${JSON.stringify(k)});if(!S.z.length)S.z=[{id:++S.nid,t:'سبحان الله',c:Object.keys(S.cats)[0]||'m',g:33}];S.cur=S.z[0].id;F='all';V='home';sheet();R()">حذف</button>`)

function pick(id){
S.cur=id;
DAY=D(0);
nav('tas')
}

function openDayTas(id,off){
S.cur=id;
DAY=D(off);
nav('tas')
}

function Tas(){
const z=Z(S.cur),
dk=DAY||D(0),
c=cnt(z.id,dk),
i=S.z.indexOf(z),
lit=c%7;

return `<div class="tas"><div class="card" style="margin:0;min-height:260px;display:flex;flex-direction:column" onclick="tap()">

<div class="row sp"><button class="ib" onclick="event.stopPropagation();detail(${z.id})">ⓘ</button><span class="pill">${i+1} / ${S.z.length}</span><button class="ib" onclick="event.stopPropagation();setGoal(${z.id})">🎯</button></div>

<div style="text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0">${zhead(z,1)}</div>

<div class="mu" style="text-align:center">${dk===CURRENT_DAY?'اليوم':'سجل سابق'} • ${dk.split('-').reverse().join('/')}</div>

<div class="row sp" style="border-top:1px solid var(--bd);margin-top:14px;padding-top:12px"><span class="mu">الهدف: ${z.g} مرة</span><span style="color:var(--am);font-weight:700">🔥 ${streak(z)} أيام</span></div></div>

<div class="beads">${[1,2,3,4,5,6].map(n=>`<div class="bd ${n<=lit?'on':''}"></div>`).join('')}<div class="cnt">${c}</div></div></div>

<div class="circle" onclick="tap()">${ring(pc(c,z.g),280,6)}<div><b>${c}</b><hr style="width:130px;border:0;border-top:3px solid var(--bd);margin:10px auto"><span class="mu" style="font-size:24px">${z.g}</span></div></div>

<div class="steps">${[1,10,33,100].map(n=>`<button type="button" onclick="addAmount(${n})">+${n}</button>`).join('')}<button type="button" onclick="step()">✎</button></div>

<div class="ctl"><button type="button" onclick="mv(-1)">›</button><button type="button" style="color:#ff6b6b;font-weight:800" onclick="rst()">تصفير</button><button type="button" onclick="undo()">↶</button><button type="button" onclick="mv(1)">‹</button></div>`
}

function addAmount(n){
add(S.cur,n,1,DAY||D(0));
R()
}

function tap(){
addAmount(S.step)
}

function step(){
const n=parseInt(prompt('عدد التسبيحات لكل نقرة','1'));
if(n>0){S.step=n;save();R()}
}

function setGoal(id){
 const z=Z(id), n=parseInt(prompt('الهدف اليومي لهذا الذكر',String(z.g)));
 if(n>0){z.g=n;save();R()}
}

function mv(d){
const i=(S.z.indexOf(Z(S.cur))+d+S.z.length)%S.z.length;
S.cur=S.z[i].id;
R()
}

function undo(){
const u=U.pop();
if(u){
add(u[0],-u[2],0,u[1]);
R()
}
}

function rst(){
const k=DAY||D(0);
add(S.cur,-cnt(S.cur,k),0,k);
R()
}

function Prog(){
const G=S.z.length,
dn=S.z.filter(z=>cnt(z.id,D(0))>=z.g).length,
tot=dayT(D(0)),
p=pc(dn,G),
dow=new Date().getDay();

return `<div class="card row sp"><button class="pill" onclick="more(1)">لوحة التقدم ←</button><div><div style="font-size:22px;font-weight:800">${dn} / ${G} أهداف مكتملة</div><div class="mu">${tot} تسبيحة اليوم • الهدف الإجمالي ${S.v7.dailyGoal} • كل تسبيحة تُكتب لك حسنة 🌿</div></div><div style="position:relative;width:84px;height:84px;display:grid;place-items:center">${ring(p,84,9)}<b class="ac" style="position:absolute">${p}%</b></div></div>

<div class="card"><div class="row sp" style="margin-bottom:12px"><b class="ac" style="font-size:20px">▭ هذا الأسبوع</b><span class="mu">${D(0).split('-').reverse().join('/')}</span></div><div class="week">${week()}</div></div>

${stats()}<h2 style="font-size:24px;border-inline-start:6px solid var(--ac);padding-inline-start:10px">الأذكار والعادات</h2>

${S.z.map(z=>{const c=cnt(z.id,D(0));return `<div class="card"><div class="row sp"><span class="pill">${pc(c,z.g)}%</span><div class="zt" style="font-size:19px;line-height:1.6;text-align:start;flex:1">${z.t.length>40?z.t.slice(0,38)+'…':z.t}</div></div>

<div class="row sp mu" style="margin:6px 0"><span>${c} / ${z.g} مرة • <b style="color:var(--am)">🔥 ${streak(z)} أيام</b></span><span><button onclick="detail(${z.id})">▥</button> <button onclick="openForm(${z.id})">✎</button> <button onclick="del(${z.id})">🗑</button></span></div>

<div class="cnts">${[0,1,2,3].map(o=>`<div class="cn" role="button" tabindex="0" onclick="openDayTas(${z.id},${o})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDayTas(${z.id},${o})}"><small class="mu">${o==0?'اليوم':DN[(dow-o+7)%7]}</small><b>${cnt(z.id,D(o))}</b><button onclick="event.stopPropagation();adj(${z.id},${o},-1)">-</button><button onclick="event.stopPropagation();adj(${z.id},${o},1)">+</button></div>`).join('')}</div></div>`}).join('')}`
}

function sheet(h){
const e=$('#sh');
if(!h){
e.className='';
e.innerHTML='';
return
}
e.innerHTML=`<div class="sb" onclick="sheet()"></div><div class="sp2"><i class="gr"></i>${h}</div>`;
e.className='open'
}

function detail(id){
const z=Z(id);

const bar=(l,n)=>{
const d=sumD(id,n),
g=z.g*n;

return `<div class="row sp" style="margin-top:14px"><span style="font-size:18px">${l}</span><span class="mu">${g} / <b style="color:var(--bl);font-size:20px">${d}</b></span></div><div class="bar bl" style="margin-top:6px"><i style="width:${pc(d,g)}%"></i></div>`
};

sheet(`<div class="card" style="text-align:center">${zhead(z,1)}</div><div class="tiles"><div class="card tile">⟳<b style="font-size:20px">كل يوم</b><span class="mu">التكرار</span></div><div class="card tile"><span class="ac">◎</span><b>${z.g}</b><span class="mu">الهدف</span></div>

<div class="card tile" onclick="S.mute=!S.mute;save();detail(${id})">${S.mute?'🔕':'🔔'}<b style="font-size:18px">${S.mute?'التذكير متوقف':'التذكير يعمل'}</b><span class="mu">التذكير</span></div><div class="card tile" style="color:var(--am)">🔥<b>${streak(z)} أيام</b><span class="mu">السلسلة</span></div></div>

<div class="card"><b class="ac" style="font-size:20px">الهدف والتقدم</b>${bar('اليوم',1)}${bar('الأسبوع',7)}${bar('الشهر',30)}${bar('الربع',90)}${bar('السنة',365)}</div>

<button class="btn" onclick="pick(${id});sheet()">ابدأ التسبيح</button>`)
}

function openForm(id,c0){
const z=id?Z(id):{t:'',c:c0||(V=='cat'&&S.cats[Q]?Q:Object.keys(S.cats)[0]),g:33};

sheet(`<h2 style="margin:0 0 8px">${id?'تعديل الذكر':'إضافة ذكر'}</h2>عنوان الذكر<textarea id="ft" rows="2">${z.t}</textarea>النص الكامل (اختياري)<textarea id="fb" rows="4">${z.b||''}</textarea>التصنيف<select id="fc">${Object.entries(S.cats).map(([k,v])=>`<option value="${k}" ${z.c==k?'selected':''}>${v}</option>`).join('')}</select>الهدف (عدد المرات)<input id="fg" type="number" min="1" value="${z.g}"><button class="btn" onclick="saveF(${id||0})">حفظ</button>`)
}

function saveF(id){
const t=$('#ft').value.trim(),
b=$('#fb').value.trim(),
c=$('#fc').value,
g=Math.max(1,parseInt($('#fg').value)||1);

if(!t)return;

if(id){
Object.assign(Z(id),{t,b,c,g})
}else{
S.z.unshift({id:++S.nid,t,b,c,g});
S.cur=S.nid
}

sheet();
R()
}

sheet(`<h3>حذف هذا الذكر؟</h3><div class="mu" style="margin-bottom:14px">${Z(id).t}</div><button class="btn rd" onclick="S.z=S.z.filter(z=>z.id!=${id});if(!S.z.length)S.z=[{id:++S.nid,t:'سبحان الله',c:'p',g:33}];S.cur=S.z[0].id;F='all';V='home';sheet();R()">حذف</button>`)

function routineUI(type){const name=type==='morning'?'روتين الصباح 🌅':'روتين المساء 🌙',ids=S.v7.routines[type]||[];sheet(`<div class="row sp"><h2 style="margin:0">${name}</h2><button class="ib" onclick="more()">✕</button></div><div class="mu" style="margin-bottom:10px">اختر الأذكار التي تريد ظهورها بالترتيب في هذا الروتين.</div>${S.z.map(z=>`<div class="routine-item"><input type="checkbox" ${ids.includes(z.id)?'checked':''} onchange="toggleRoutine('${type}',${z.id},this.checked)"><span style="flex:1">${z.t}</span>${ids.includes(z.id)?`<button class="mini" onclick="moveRoutine('${type}',${z.id},-1)">↑</button><button class="mini" onclick="moveRoutine('${type}',${z.id},1)">↓</button>`:''}<small>${S.cats[z.c]||''}</small></div>`).join('')}<button class="btn" onclick="startRoutine('${type}')">▶ بدء الروتين</button>`)}

function advancedStats(){const ds=[...Array(30).keys()].reverse().map(i=>[D(i),dayT(D(i))]),total=allT(),active=ds.filter(x=>x[1]>0).length,avg=active?Math.round(ds.reduce((a,x)=>a+x[1],0)/active):0,best=Math.max(0,...ds.map(x=>x[1])),goal=S.v7.dailyGoal,goalDays=ds.filter(x=>x[1]>=goal).length;let bestStreak=0,cur=0;for(let i=0;i<90;i++){if(dayT(D(i))>0)cur++;else{bestStreak=Math.max(bestStreak,cur);cur=0}}bestStreak=Math.max(bestStreak,cur);sheet(`<div class="row sp"><h2 style="margin:0">📊 الإحصائيات المتقدمة</h2><button class="ib" onclick="more()">✕</button></div><div class="statgrid"><div class="statbox"><div class="num">${total}</div><div class="mu">كل التسبيحات</div></div><div class="statbox"><div class="num">${avg}</div><div class="mu">متوسط اليوم النشط</div></div><div class="statbox"><div class="num">${best}</div><div class="mu">أفضل يوم</div></div><div class="statbox"><div class="num">${goalDays}</div><div class="mu">أيام حققت الهدف</div></div><div class="statbox"><div class="num">${active}</div><div class="mu">أيام نشطة / 30</div></div><div class="statbox"><div class="num">🔥 ${bestStreak}</div><div class="mu">أفضل سلسلة نشاط</div></div></div><h3>📅 السجل اليومي البصري</h3><div class="heat">${ds.map(([k,n])=>{const p=Math.min(1,n/Math.max(1,best));return `<div class="hday" title="${k}: ${n}" onclick="openDay('${k}')" style="background:color-mix(in srgb,var(--ac) ${Math.round(15+p*80)}%,var(--card))"><span>${+k.slice(8)}</span></div>`}).join('')}</div><div class="mu" style="margin-top:10px">اضغط على أي يوم لفتح سجل ذلك اليوم والتعديل عليه.</div>`)}

function imp(){
const input=document.createElement('input');
input.type='file';
input.accept='.json,application/json';
input.style.display='none';

input.onchange=()=>{
const f=input.files&&input.files[0];
if(!f)return;

const r=new FileReader();

r.onload=()=>{
try{
const o=JSON.parse(r.result);

if(!o||!Array.isArray(o.z)||!o.log)throw 0;

S=o;
S.cats=S.cats||{...DEFAULT_BACKUP.cats};
S.nid=S.nid||Math.max(100,...S.z.map(z=>+z.id||0));
S.step=S.step||1;
S.cur=S.cur||S.z[0]?.id||1;
S.theme=S.theme||'green';
S.mute=!!S.mute;
S.meta=S.meta||{};
S.v7=Object.assign({dailyGoal:100,routines:{morning:[],evening:[]}},S.v7||{});
S.v7.routines=Object.assign({morning:[],evening:[]},S.v7.routines||{});
S.z.forEach(z=>{if(typeof z.fav!=='boolean')z.fav=false});
DAY=D(0);
ensureDay();
U=[];
sheet();
R()
}catch(e){
sheet(`<h3>ملف غير صالح</h3><div class="mu" style="margin-bottom:14px">اختر ملف JSON تم تصديره من تطبيق أذكاري.</div><button class="btn" onclick="sheet()">إغلاق</button>`)
}
};

r.readAsText(f,'utf-8')
};

document.body.appendChild(input);
input.click();
setTimeout(()=>input.remove(),1000)
}
